spring:
  application:
    name: portfolio-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

github:
  # Fail-closed: empty secret rejects every webhook delivery.
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  # Fine-grained PAT with Contents:read on the showcased repos.
  token: ${GITHUB_TOKEN:}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}

admin:
  # Shared bearer secret for POST /api/admin/sync. Empty disables it.
  token: ${ADMIN_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
