name: Fallow

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  fallow:
    name: Fallow audit (warn)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        working-directory: ui
        run: npm ci

      - name: Fallow audit
        uses: fallow-rs/fallow@v3
        with:
          root: ui
          fail-on-issues: "false"
          annotations: "true"
          comment: "false"
          sarif: "false"
