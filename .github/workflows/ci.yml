name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (incl. JaCoCo gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/portfolio
      DB_USER: portfolio
      DB_PASSWORD: portfolio
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        working-directory: api
        # verify (not test): the JaCoCo coverage gate binds to verify.
        run: ./mvnw -B verify

  ui:
    name: UI tests, build, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Lint
        working-directory: ui
        run: npm run lint

  compose:
    name: Compose build + smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_PORT: 8082
      UI_PORT: 8083
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build api ui

      - name: Start stack
        run: docker compose up -d db api ui

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            api=$(docker inspect --format='{{.State.Health.Status}}' portfolio-api-1 2>/dev/null)
            ui=$(docker inspect --format='{{.State.Health.Status}}' portfolio-ui-1 2>/dev/null)
            if [ "$api" = "healthy" ] && [ "$ui" = "healthy" ]; then echo "stack healthy"; break; fi
            sleep 10
          done
          [ "$(docker inspect --format='{{.State.Health.Status}}' portfolio-api-1)" = "healthy" ]
          [ "$(docker inspect --format='{{.State.Health.Status}}' portfolio-ui-1)" = "healthy" ]

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8082/api/health | grep -q '"status":"UP"'
          html=$(curl -fsS http://localhost:8083/)
          echo "$html" | grep -qi '<!doctype html>'
          curl -fsS http://localhost:8083/api/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8083/api/projects
          # SPA fallback for client routes
          curl -fsS -o /dev/null http://localhost:8083/projects
          # Hashed bundle serves with immutable cache
          asset=$(echo "$html" | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8083$asset" | grep -qi 'immutable'

      - name: Tear down
        if: always()
        run: docker compose down -v
