name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (incl. JaCoCo gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/portfolio
      DB_USER: portfolio
      DB_PASSWORD: portfolio
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        working-directory: api
        # verify (not test): the JaCoCo coverage gate binds to verify.
        run: ./mvnw -B verify

  ui:
    name: UI tests, build, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Lint
        working-directory: ui
        run: npm run lint

  compose:
    name: Compose image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build api ui
