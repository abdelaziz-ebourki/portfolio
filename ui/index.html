<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alex Moreau — Développeur Full-Stack Java & React. Portfolio."
    />
    <title>alex@dev:~$ — Alex Moreau · Portfolio</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem("portfolio-theme")
          if (theme === "light") {
            document.documentElement.classList.remove("dark")
            document.documentElement.classList.add("light")
          }
          var stored = localStorage.getItem("portfolio-lang")
          var lang = stored === "en" || stored === "fr" || stored === "ar"
            ? stored
            : (navigator.language || "en").toLowerCase().startsWith("ar")
              ? "ar"
              : (navigator.language || "en").toLowerCase().startsWith("fr")
                ? "fr"
                : "en"
          document.documentElement.lang = lang
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
      <p style="padding: 2rem; text-align: center">
        This portfolio needs JavaScript to render.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
